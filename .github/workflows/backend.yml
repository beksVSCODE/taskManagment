name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'dash_bord/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'dash_bord/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./dash_bord

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Set test environment variables
        run: |
          echo "JWT_SECRET=test_jwt_secret_for_ci_minimum_32_characters_long_here" >> $GITHUB_ENV
          echo "CORS_ALLOWED_ORIGINS=http://localhost:3000" >> $GITHUB_ENV
          echo "PGPASSWORD=test" >> $GITHUB_ENV
          echo "TELEGRAM_BOT_ENABLED=false" >> $GITHUB_ENV

      - name: Run tests
        run: ./mvnw test --batch-mode --fail-at-end

      - name: Build application
        run: ./mvnw package -DskipTests --batch-mode

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: dash_bord/target/surefire-reports/

      - name: Check for test failures
        if: failure()
        run: |
          echo "Tests failed! Check the test reports artifact."
          exit 1

name: Full CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dash_bord

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      
      - name: Set test environment
        run: |
          echo "JWT_SECRET=test_jwt_secret_for_ci_minimum_32_characters_long_here" >> $GITHUB_ENV
          echo "CORS_ALLOWED_ORIGINS=http://localhost:3000" >> $GITHUB_ENV
          echo "PGPASSWORD=test" >> $GITHUB_ENV
          echo "TELEGRAM_BOT_ENABLED=false" >> $GITHUB_ENV
      
      - name: Run tests
        run: ./mvnw test --batch-mode
      
      - name: Build
        run: ./mvnw package -DskipTests --batch-mode
      
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: dash_bord/target/*.jar

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./project-pulse

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: project-pulse/package-lock.json
      
      - name: Install
        run: npm ci
      
      - name: Test
        run: npm test
      
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api
      
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: project-pulse/dist/

  integration:
    name: Integration Check
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
      
      - name: Verify artifacts
        run: |
          echo "Backend JAR:"
          ls -lh backend-jar/
          echo ""
          echo "Frontend dist:"
          ls -lh frontend-dist/
      
      - name: ✅ All checks passed
        run: echo "Backend and Frontend builds successful!"

# ────────────────────────────────────────────────────────────────────
# ВАЖНЫЕ ЗАМЕЧАНИЯ
# ────────────────────────────────────────────────────────────────────
#
# 1. Rate limit по умолчанию использует $binary_remote_addr (IP клиента)
#    Для X-Forwarded-For используйте:
#    limit_req_zone $http_x_forwarded_for zone=login_limit:10m rate=5r/m;
#
# 2. Размер зоны:
#    - 1MB хранит ~16000 IP адресов
#    - 10MB хранит ~160000 IP адресов
#
# 3. Rate формат:
#    - r/s - запросов в секунду
#    - r/m - запросов в минуту
#    - Пример: 10r/s = 600r/m
#
# 4. Burst параметр:
#    - Разрешает "всплеск" запросов сверх rate
#    - burst=3 + rate=5r/m = разрешает 3 быстрых запроса, затем 5/мин
#    - nodelay - не задерживать запросы в пределах burst
#
# 5. Production настройки:
#    - Для строгой защиты: rate=3r/m burst=1
#    - Для баланса: rate=5r/m burst=3 (текущая конфигурация)
#    - Для мягкого лимита: rate=10r/m burst=5
#
# 6. Мониторинг:
#    - Логи rate limiting: grep "limiting requests" /var/log/nginx/error.log
#    - Статистика 429 ошибок: grep " 429 " /var/log/nginx/access.log | wc -l

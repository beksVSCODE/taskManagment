# Nginx Rate Limiting для защиты от brute force
# Альтернатива backend-native решению для production с несколькими инстансами

# Определение зон для rate limiting
# zone=login_limit - хранит состояние для login endpoint (10MB хватает на ~160k IP)
# rate=5r/m - максимум 5 запросов в минуту на IP
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# zone=api_limit - общий rate limit для всего API (опционально)
# rate=100r/m - максимум 100 запросов в минуту на IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

upstream backend {
    server localhost:8080;
    # Для multiple instances:
    # server app1:8080;
    # server app2:8080;
}

server {
    listen 80;
    server_name yourdomain.com;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Общие настройки для reverse proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ────────────────────────────────────────────────────────────────
    # RATE LIMITING для /api/auth/login
    # ────────────────────────────────────────────────────────────────
    location = /api/auth/login {
        # Применяем rate limit: 5 запросов в минуту
        # burst=3 - разрешаем "всплеск" до 3 дополнительных запросов
        # nodelay - не задерживать запросы в пределах burst
        limit_req zone=login_limit burst=3 nodelay;

        # Кастомная страница ошибки для 429
        limit_req_status 429;
        
        # Добавляем Retry-After header (в секундах)
        add_header Retry-After 60 always;

        proxy_pass http://backend;
        proxy_http_version 1.1;
    }

    # ────────────────────────────────────────────────────────────────
    # Остальные auth endpoints (register, etc.) - без rate limit
    # ────────────────────────────────────────────────────────────────
    location /api/auth/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
    }

    # ────────────────────────────────────────────────────────────────
    # Общий API - опциональный rate limit (закомментировано)
    # ────────────────────────────────────────────────────────────────
    location /api/ {
        # Раскомментируйте для общего rate limiting всего API:
        # limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
    }

    # ────────────────────────────────────────────────────────────────
    # Health checks (без rate limit)
    # ────────────────────────────────────────────────────────────────
    location /actuator/health {
        proxy_pass http://backend;
        access_log off; # Не логировать health checks
    }

    # ────────────────────────────────────────────────────────────────
    # Frontend static files
    # ────────────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

# ────────────────────────────────────────────────────────────────────
# Кастомная обработка 429 ошибки (опционально)
# ────────────────────────────────────────────────────────────────────

# Production environment configuration
# All sensitive values MUST be provided via environment variables

# CRITICAL: Set these environment variables in your production environment:
# - PGPASSWORD (or DB_PASSWORD or SPRING_DATASOURCE_PASSWORD)
# - JWT_SECRET (minimum 32 characters, use: openssl rand -base64 64)
# - TELEGRAM_BOT_TOKEN (if telegram notifications enabled)
# - GEMINI_API_KEY (if using voice features with Gemini)

# Database SSL should be enabled in production
DB_SSLMODE=require

# Reverse proxy/nginx support (REQUIRED for production behind proxy)
server.forward-headers-strategy=framework

# JPA settings for production (NEVER use 'update' or 'create-drop')
JPA_DDL_AUTO=validate
SHOW_SQL=false

# Telegram settings
TELEGRAM_BOT_ENABLED=true
# TELEGRAM_FRONTEND_BASE_URL=https://your-production-domain.com

# Voice features
VOICE_STT_PROVIDER=gemini
VOICE_PARSE_PROVIDER=gemini

# CORS - ONLY production frontend URL (MUST be set via environment variable)
# Example: CORS_ALLOWED_ORIGINS=https://your-domain.com,https://www.your-domain.com
# NEVER use "*" with credentials=true
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Actuator (hide details in production for security)
management.endpoint.health.show-details=when-authorized
management.endpoints.web.exposure.include=health,metrics,prometheus

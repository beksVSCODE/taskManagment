# Development environment configuration
# This file is used for local development only

# Database (local PostgreSQL) - overrides default
spring.datasource.url=jdbc:postgresql://localhost:5432/dash_bord_1?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=beka2006
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.data-source-properties.sslmode=disable

# JWT (weak secret for dev only - DO NOT use in production!)
jwt.secret=dev_only_secret_key_minimum_32_chars_long_for_local_testing
jwt.expiration=86400000

# Gemini API (you need to set your own key)
# GEMINI_API_KEY=your_dev_api_key_here

# Telegram Bot (you need to set your own token)
# TELEGRAM_BOT_TOKEN=your_dev_bot_token_here
TELEGRAM_BOT_ENABLED=false
TELEGRAM_BOT_USERNAME=dash_bord_bot
TELEGRAM_FRONTEND_BASE_URL=http://localhost:3000

# Voice features (disabled by default in dev)
VOICE_STT_PROVIDER=client
VOICE_PARSE_PROVIDER=gemini

# JPA settings for dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Database SSL
spring.datasource.hikari.data-source-properties.sslmode=disable

# Reverse proxy (not needed in dev, but can be enabled for testing)
# server.forward-headers-strategy=framework

# CORS - allow all local dev ports
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8081

# Actuator (show all details in dev)
management.endpoint.health.show-details=always

spring.application.name=dash_bord
server.port=${PORT:8080}

# Reverse proxy support (X-Forwarded-* headers)
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:dash_bord_1}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:${PGUSER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD}}}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSLMODE:disable}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyChangeInProduction1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# CORS configuration (set via profile-specific properties or env var)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}

# Rate limiting для защиты от brute force
security.rate-limit.login.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
security.rate-limit.login.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:300}

# Voice task feature (audio -> text)
voice.stt.provider=${VOICE_STT_PROVIDER:client}

voice.stt.openai.base-url=${VOICE_STT_OPENAI_BASE_URL:https://api.openai.com/v1}
voice.stt.openai.api-key=${VOICE_STT_OPENAI_API_KEY:}
voice.stt.openai.model=${VOICE_STT_OPENAI_MODEL:whisper-1}

voice.stt.gemini.base-url=${VOICE_STT_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
voice.stt.gemini.api-key=${VOICE_STT_GEMINI_API_KEY:${GEMINI_API_KEY:}}
voice.stt.gemini.model=${VOICE_STT_GEMINI_MODEL:gemini-flash-latest}
# Voice task feature (text -> structured draft via LLM)
voice.parse.provider=${VOICE_PARSE_PROVIDER:gemini}

voice.parse.openai.base-url=${VOICE_PARSE_OPENAI_BASE_URL:${VOICE_STT_OPENAI_BASE_URL:https://api.openai.com/v1}}
voice.parse.openai.api-key=${VOICE_PARSE_OPENAI_API_KEY:${VOICE_STT_OPENAI_API_KEY:}}
voice.parse.openai.model=${VOICE_PARSE_OPENAI_MODEL:gpt-4o-mini}

voice.parse.gemini.base-url=${VOICE_PARSE_GEMINI_BASE_URL:${VOICE_STT_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}}
voice.parse.gemini.api-key=${VOICE_PARSE_GEMINI_API_KEY:${GEMINI_API_KEY:}}
voice.parse.gemini.model=${VOICE_PARSE_GEMINI_MODEL:gemini-flash-latest}

# Telegram notifications
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:true}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:dummy_token_for_dev_environment}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:dash_bord_bot}
telegram.bot.api-base=${TELEGRAM_BOT_API_BASE:https://api.telegram.org}
telegram.link.ttl-minutes=${TELEGRAM_LINK_TTL_MINUTES:20}
telegram.notifications.frontend-base-url=${TELEGRAM_FRONTEND_BASE_URL:http://localhost:3000}

# Telegram webhook security (ВАЖНО для production!)
telegram.webhook.secret-token=${TELEGRAM_WEBHOOK_SECRET_TOKEN:}

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.info.env.enabled=true

# Application info
info.app.name=@project.name@
info.app.version=@project.version@
info.app.description=Task Management System

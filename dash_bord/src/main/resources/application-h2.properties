# H2 in-memory database for development/testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (для отладки в браузере: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT (weak secret for dev only - DO NOT use in production!)
jwt.secret=dev_only_secret_key_minimum_32_chars_long_for_local_testing
jwt.expiration=86400000

# Telegram Bot (disabled in dev)
TELEGRAM_BOT_ENABLED=false
TELEGRAM_BOT_USERNAME=dash_bord_bot
TELEGRAM_FRONTEND_BASE_URL=http://localhost:3000

# Voice features (disabled by default in dev)
VOICE_STT_PROVIDER=client
VOICE_PARSE_PROVIDER=gemini

# CORS - allow all local dev ports
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:8081

# Actuator (show all details in dev)
management.endpoint.health.show-details=always

# ============================================
# Docker Compose Production Configuration
# Single-server deployment with Nginx reverse proxy
# ============================================
version: '3.8'

services:
  # ──────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: projectpulse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PGDATABASE:-dash_bord_prod}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend_network

    # Internal only - not exposed to host
    expose:
      - "5432"

  # ──────────────────────────────────────────
  # Spring Boot Backend
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./dash_bord
      dockerfile: Dockerfile
    container_name: projectpulse-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Database connection
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-dash_bord_prod}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD}
      DB_SSLMODE: disable # Internal Docker network, SSL not needed

      # JPA settings (CRITICAL: use 'validate' in production)
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      SHOW_SQL: false

      # Security
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      # CORS - allow requests from nginx
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}

      # Rate limiting (backend-native, works with multiple instances)
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: 5
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: 300

      # Telegram bot (optional)
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_FRONTEND_BASE_URL: ${TELEGRAM_FRONTEND_BASE_URL:-http://localhost}
      TELEGRAM_WEBHOOK_SECRET_TOKEN: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:-}

      # AI services (optional)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VOICE_STT_PROVIDER: ${VOICE_STT_PROVIDER:-gemini}
      VOICE_PARSE_PROVIDER: ${VOICE_PARSE_PROVIDER:-gemini}

      # Server
      PORT: 8080

      # Spring profile
      SPRING_PROFILES_ACTIVE: prod

    volumes:
      - uploads_data:/app/uploads

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health/liveness" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    networks:
      - backend_network

    # Internal only
    expose:
      - "8080"

  # ──────────────────────────────────────────
  # React Frontend
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./project-pulse
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api # Nginx will proxy /api to backend
    container_name: projectpulse-frontend
    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    networks:
      - backend_network

    # Internal only
    expose:
      - "80"

  # ──────────────────────────────────────────
  # Nginx Reverse Proxy
  # ──────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: projectpulse-nginx
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

    ports:
      - "80:80"
      # Uncomment for HTTPS (after configuring SSL)
      # - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL certificates
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/actuator/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - backend_network

# ──────────────────────────────────────────
# Named Volumes (persistent data)
# ──────────────────────────────────────────
volumes:
  postgres_data:
    name: projectpulse_postgres_data
  uploads_data:
    name: projectpulse_uploads_data
  nginx_logs:
    name: projectpulse_nginx_logs

# ──────────────────────────────────────────
# Networks
# ──────────────────────────────────────────
networks:
  backend_network:
    name: projectpulse_network
    driver: bridge
